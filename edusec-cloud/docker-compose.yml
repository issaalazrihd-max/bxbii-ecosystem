services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edusec
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: edusec_cloud
    ports:
      - "5432:5432"
    volumes:
      - edusec_pg_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  edusec_pg_data:
